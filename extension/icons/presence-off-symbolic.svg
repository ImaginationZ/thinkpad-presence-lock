<?xml version="1.0" encoding="UTF-8"?>
<svg height="16px" viewBox="0 0 16 16" width="16px" xmlns="http://www.w3.org/2000/svg">
    <!-- The present icon with a gap cut out around the slash, Adwaita
         "-disabled" style. A clip path, not a mask, so symbolic recoloring
         can't affect it. -->
